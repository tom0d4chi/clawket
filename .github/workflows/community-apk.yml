name: community-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/community-apk.yml'

concurrency:
  group: community-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/clawket-release.jks"

      - name: Build release APK (arm64-v8a)
        working-directory: apps/mobile/android
        env:
          CLAWKET_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/clawket-release.jks
          CLAWKET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLAWKET_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLAWKET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon --max-workers=4

      - name: Collect APK
        run: |
          mkdir -p out
          find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: clawket-release-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
